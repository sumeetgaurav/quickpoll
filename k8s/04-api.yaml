apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: quickpoll
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: sumeetgaurav/quickpoll-api:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 3000 }]
          envFrom:
            - secretRef: { name: quickpoll-secrets }
          readinessProbe:
            httpGet: { path: /api/readyz, port: 3000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /api/healthz, port: 3000 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: quickpoll
spec:
  selector: { app: api }
  ports: [{ port: 3000, targetPort: 3000 }]
